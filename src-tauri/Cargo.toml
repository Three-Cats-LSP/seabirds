[package]
name = "seabirds"
version = "0.1.10"
description = "SeaBirds native dive log"
authors = ["Three Cats LSP"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
mime_guess = "2.0.5"
rfd = "0.15.4"
rust-embed = "8.7.2"
serde = { version = "1.0", features = ["derive"] }
serialport = "4.8.1"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-opener = "2"
tiny_http = "0.12.0"
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
