name: Update Official SeaBirds Site

on:
  push:
    branches: [main]
    paths:
      - "www/**"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-site-sync
  cancel-in-progress: true

jobs:
  request-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request official site update
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          gh api --method POST \
            repos/Three-Cats-LSP/threecats-lsp.com/dispatches \
            -f event_type=sync-seabirds
