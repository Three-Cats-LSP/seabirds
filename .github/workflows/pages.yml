name: Deploy SeaBirds Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync:www
      - name: Add signed native downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.1.13 --repo Three-Cats-LSP/seabirds --pattern 'SeaBirds.apk' --pattern 'SeaBirds-Windows-Setup.exe' --dir www
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
