name: Build SeaBirds

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Install SeaBirds Firebase Android configuration
        shell: bash
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$FIREBASE_GOOGLE_SERVICES_JSON" || { echo "FIREBASE_GOOGLE_SERVICES_JSON is not configured"; exit 1; }
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > android/app/google-services.json
      - name: Install Android release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is not configured"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/seabirds-upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/seabirds-upload.jks" >> "$GITHUB_ENV"
      - name: Sync native assets
        shell: pwsh
        run: npm run android:sync
      - name: Build signed release APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace
      - name: Verify Android upgrade identity
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$APK" | head -1)"
          echo "$BADGING"
          grep -q "name='com.threecats.seabirds'" <<< "$BADGING"
          grep -q "versionCode='108'" <<< "$BADGING"
          grep -q "versionName='0.1.8'" <<< "$BADGING"
          CERTIFICATE="$($APKSIGNER verify --print-certs "$APK")"
          echo "$CERTIFICATE"
          grep -qi "8a3f8a36bd1b97b18d6af34247d8fe1734b90e1468420c042372fb9801ae92e3" <<< "${CERTIFICATE//:/}"
      - uses: actions/upload-artifact@v4
        with:
          name: SeaBirds-Android-Signed-Release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  windows:
    name: Lightweight Windows EXE
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Tauri WebView2 installer
        run: npm run windows:build
      - uses: actions/upload-artifact@v4
        with:
          name: SeaBirds-Windows-Tauri-EXE
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
